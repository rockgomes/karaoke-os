name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  map:
    name: docs/MAP.md matches the routes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-map.mjs

  web:
    name: web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Not `npm ci`. Tailwind v4 ships a wasm32-wasi fallback whose bundled
      # @emnapi dependencies npm will not resolve on macOS, so a lock file
      # generated here can never satisfy `npm ci` on Linux. `npm install`
      # still honours the pinned versions in the lock file; it only fills in
      # the platform packages macOS omitted.
      - run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      # Next 16 generates global types such as LayoutProps into .next/types.
      # Without this, tsc fails on a fresh checkout with "Cannot find name
      # 'LayoutProps'" while the same code compiles locally after a build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        # The build reads these at module load. They are publishable keys,
        # not secrets, but CI has no project attached, so placeholders keep
        # the build honest without pointing at the real database.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
        run: npm run build
