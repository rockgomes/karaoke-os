# The app lives in web/. Everything above it is the superseded prototype.
[build]
  base = "web"
  command = "npm run build"
  # Relative to `base`. A clean-clone build resolved "web/.next" to
  # web/web/.next and the Next runtime found no output there.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Serves the App Router, server actions, and src/proxy.ts on Netlify's
# functions. Without it only static files would be published.
[[plugins]]
  package = "@netlify/plugin-nextjs"
