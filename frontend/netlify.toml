[build]
  base    = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  # The app's own components carry pre-existing lint warnings. Netlify sets
  # CI=true by default, which turns those into build failures.
  CI = "false"
  REACT_APP_DEMO = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    # Demo data only, but there is no reason for it to appear in search.
    X-Robots-Tag           = "noindex, nofollow"
